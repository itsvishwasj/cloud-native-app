name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx to leverage fast multi-stage build caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Authenticate into Docker Hub using GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push Docker image
      # NOTE: Make sure your Docker Hub repository is named 'cloud-native-app'.
      # Tags are formatted as '<YOUR_DOCKERHUB_USERNAME>/cloud-native-app:latest'.
      # You can replace '${{ secrets.DOCKERHUB_USERNAME }}' below with your actual Docker Hub username directly if preferred:
      # e.g., myusername/cloud-native-app:latest
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
