apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: web-app
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default

  selector:
    matchLabels:
      app: web-app

  endpoints:
    - port: http
      path: /metrics
      interval: 5s
